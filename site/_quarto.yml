# =============================================================================
# Base Quarto project. Shared by both language profiles.
# =============================================================================
#
# Base project configuration. This file carries everything that does NOT depend
# on the language; `_quarto-en.yml` and `_quarto-pt.yml` are OVERRIDES merged
# on top of it, not replacements for it -- `quarto render site --profile en`
# fails with "no project" if this file is absent.
#
# Format choice: a `website` project of plain HTML pages, not `format:
# dashboard`. Five pages with long-form normative text (about.qmd publishes
# the declared limitations in full) read badly inside a viewport-filling
# dashboard grid, and a website gives direct control over semantic tables and
# figure `alt` text, which accessibility requires. The status cards are
# hand-written HTML in `styles.css`, so the page needs no JavaScript at all:
# every page is static HTML plus one stylesheet -- no server, no WASM.
#
# `output-dir` is relative to this directory (`site/`), so `../_site` puts
# the build in `_site/` at the REPOSITORY root, which is what
# .github/workflows/collect.yml publishes to `gh-pages`.

project:
  type: website
  output-dir: ../_site
  render:
    - index.qmd
    - cran.qmd
    - github.qmd
    - academic.qmd
    - about.qmd

# A bare `quarto render site` (no --profile) renders English. The production
# workflow always passes --profile explicitly; this only keeps a local render
# from silently producing an unlocalised site.
profile:
  default: en

execute:
  echo: false
  warning: false
  message: false
  # Every page is cheap to render and reads JSON that changes daily; a freeze
  # cache would serve yesterday's numbers.
  freeze: false

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    toc-location: right
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    # Charts are embedded as data URIs and there is no JavaScript of our own,
    # so the page is already self-contained apart from Quarto's own assets.
    fig-responsive: true
    df-print: default
