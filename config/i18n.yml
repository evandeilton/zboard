# -- SPEC.md S10, published in full and in both languages. NORMATIVE. ---------
about.limits.title:
  en: "Declared limitations"
  pt: "Limitações declaradas"
about.limits.lead:
  en: "Methodological transparency is a requirement, not a courtesy. The text below is normative and is published in both languages."
  pt: "Transparência metodológica é requisito, não cortesia. O texto abaixo é normativo e é publicado nos dois idiomas."
about.limit.1.title:
  en: "Downloads are not a census."
  pt: "Downloads não são censo."
about.limit.1.body:
  en: "The series reflects exclusively the `cloud.r-project.org` (Posit) mirror. There is no known inclusion probability for the remaining mirrors; therefore no unbiased estimator of the total number of downloads exists. Use the series for relative trend, never as an absolute level."
  pt: "A série reflete exclusivamente o mirror `cloud.r-project.org` (Posit). Não há probabilidade de inclusão conhecida para os demais mirrors; portanto, não existe estimador não-enviesado do total de downloads. Use a série para tendência relativa, nunca como nível absoluto."
about.limit.2.title:
  en: "Contamination by automation."
  pt: "Contaminação por automação."
about.limit.2.body:
  en: "CRAN check farms, Docker images and third-party CI pipelines inflate the count. In niche packages, the non-human fraction may be the majority."
  pt: "Farms de check do CRAN, imagens Docker e pipelines de CI de terceiros inflam a contagem. Em pacotes de nicho, a fração não-humana pode ser majoritária."
about.limit.3.title:
  en: "Release artefact."
  pt: "Artefato de release."
about.limit.3.body:
  en: "Every new version produces a jump of several times the baseline, caused by the rebuilding of Windows and macOS binaries. The release markers on the chart exist to make that artefact visible — not to correct it."
  pt: "Cada nova versão gera um salto de várias vezes a linha de base pela reconstrução de binários Windows/macOS. Os marcadores de release no gráfico existem para tornar esse artefato visível — não para corrigi-lo."
about.limit.4.title:
  en: "Traffic with a truncated start."
  pt: "Tráfego com início truncado."
about.limit.4.body:
  en: "The series begins on the date of the first collection; the period before it is inaccessible by design of the API."
  pt: "A série começa na data da primeira coleta; o período anterior é inacessível por design da API."
about.limit.5.title:
  en: "Citations with a lag."
  pt: "Citações com defasagem."
about.limit.5.body:
  en: "OpenAlex counts have an indexing latency of weeks to months and incomplete coverage for software."
  pt: "Contagens do OpenAlex têm latência de indexação de semanas a meses e cobertura incompleta para software."

about.nongoals.title:
  en: "What this dashboard deliberately does not do"
  pt: "O que este painel deliberadamente não faz"
about.nongoals.modelling:
  en: "**No modelling, forecasting or anomaly detection.** The dashboard is descriptive. CRAN download series are a convenience sample from a single mirror, contaminated by continuous integration and bots; modelling them would produce inference with no external validity."
  pt: "**Sem modelagem, previsão ou detecção de anomalia.** O painel é descritivo. As séries de download do CRAN são amostra de conveniência de um único mirror, contaminada por CI e bots; modelá-las produziria inferência sem validade externa."
about.nongoals.commits:
  en: "**No commit-count ranking or target as a headline indicator.** The metric is subject to Goodhart's law: it measures typing volume, not production. Commits appear only as a secondary series on the GitHub page."
  pt: "**Sem ranking ou meta de contagem bruta de commits como indicador de destaque.** A métrica está sujeita à lei de Goodhart: mede volume de digitação, não produção. Commits aparecem apenas como série secundária na página GitHub."
about.nongoals.thirdparty:
  en: "**No collection of identifiable third-party data.** Contributor profiles and issue e-mail addresses are out of scope; only per-repository aggregates are published."
  pt: "**Sem coleta de dados identificáveis de terceiros.** Perfis de contribuidores e e-mails de issues estão fora de escopo; apenas agregados por repositório são publicados."

about.license.title:
  en: "Licence"
  pt: "Licença"
about.license.body:
  en: "Code is published under the MIT licence. The aggregated data published on this site is available under CC-BY-4.0. Upstream data remains subject to the terms of its own provider: CRAN, GitHub and OpenAlex."
  pt: "O código é publicado sob a licença MIT. Os dados agregados publicados neste site estão disponíveis sob CC-BY-4.0. O dado de origem permanece sujeito aos termos do seu próprio provedor: CRAN, GitHub e OpenAlex."

about.source.title:
  en: "Source code"
  pt: "Código-fonte"
about.source.body:
  en: "The collectors, the consolidation pipeline and this site are a single open-source repository. The full, normative specification lives in `SPEC.md` at its root."
  pt: "Os coletores, o pipeline de consolidação e este site são um único repositório open source. A especificação completa e normativa vive em `SPEC.md` na sua raiz."
about.source.link_label:
  en: "evandeilton/zboard on GitHub"
  pt: "evandeilton/zboard no GitHub"
about.source.issues_label:
  en: "Report a problem with this dashboard"
  pt: "Relatar um problema neste painel"
about.source.issues_body:
  en: "Corrections, questions about the methodology and bug reports belong in the repository's issue tracker, where the discussion stays public and auditable."
  pt: "Correções, dúvidas sobre a metodologia e relatos de erro devem ir para o issue tracker do repositório, onde a discussão permanece pública e auditável."

