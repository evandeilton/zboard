name: 'Setup zboard'
description: >
  Sets up R, installs zboard and its dependencies (Imports and Suggests) from
  DESCRIPTION via pak, and optionally installs Quarto. Every downstream step in
  the pipeline is then a plain `zboard::fn()` call.

  This is a *local* action, so the rule "third-party actions pinned by SHA"
  applies to the actions it calls, not to the reference to this file.

inputs:
  quarto:
    description: 'Install Quarto ("true"/"false"). Only jobs that render site/ need it.'
    required: false
    default: 'false'
  cache-version:
    description: 'Bump to invalidate the cached R package library.'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
      with:
        r-version: release
        use-public-rspm: true

    # pak, not renv::restore(): renv 1.2.3 resolves a package that is absent
    # from the library and whose pinned version is no longer current on CRAN
    # against the project's own DESCRIPTION, which turned curl into a
    # dependent of httr2 and deadlocked the install. pak also installs the
    # system libraries (libcurl, fontconfig, ...) that renv only warns about.
    - name: Install zboard and its dependencies
      uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
      with:
        cache-version: ${{ inputs.cache-version }}
        extra-packages: local::.
        # Quarto is installed below by a SHA-pinned action instead.
        install-quarto: 'false'

    - name: Set up Quarto
      if: inputs.quarto == 'true'
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
