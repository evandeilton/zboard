# -- About page ---------------------------------------------------------------
about.title:
  en: "About"
  pt: "Sobre"
about.lead:
  en: "What this dashboard measures, where the numbers come from, what they cannot support, and under which licence they are published."
  pt: "O que este painel mede, de onde vêm os números, o que eles não sustentam e sob qual licença são publicados."

about.purpose.title:
  en: "Purpose"
  pt: "Objetivo"
about.purpose.body:
  en: "A static dashboard, updated daily and without a server, consolidating in one place the health of the R packages published on CRAN, their download history, development activity in the curated GitHub repositories, and the associated academic output. It serves two purposes at once: operational, detecting a CRAN regression before the official notification, and showcase, as a public portfolio artefact."
  pt: "Um painel estático, atualizado diariamente e sem servidor, que consolida em um único lugar a saúde dos pacotes R publicados no CRAN, a sua série histórica de downloads, a atividade de desenvolvimento nos repositórios GitHub curados e a produção acadêmica associada. Serve a dois propósitos simultâneos: operacional, detectando uma regressão no CRAN antes da notificação oficial, e vitrine, como artefato público de portfólio."

about.method.title:
  en: "Methodology"
  pt: "Metodologia"
about.method.body:
  en: "A scheduled job collects each source independently once a day, writes the result to a typed, columnar store, and derives from it the JSON this page reads. A failing source degrades only its own section; the rest of the dashboard still publishes with the data available. Writes are idempotent by natural key, so re-running the pipeline on the same day does not duplicate a row. Only official APIs and artefacts are used: no HTML is scraped."
  pt: "Um job agendado coleta cada fonte de forma independente uma vez por dia, grava o resultado em um armazenamento colunar tipado e dele deriva o JSON que esta página lê. Uma fonte com falha degrada apenas a sua própria seção; o restante do painel continua publicando com o dado disponível. As escritas são idempotentes por chave natural, então reexecutar o pipeline no mesmo dia não duplica linhas. Apenas APIs e artefatos oficiais são usados: nenhum HTML é raspado."
about.method.curation:
  en: "The set of packages and repositories is curated explicitly in `config/repos.yml`. Anything not listed there is not collected, not aggregated and not displayed: curation is an editorial decision, not a display filter."
  pt: "O conjunto de pacotes e repositórios é curado explicitamente em `config/repos.yml`. O que não está listado ali não é coletado, não é agregado e não é exibido: curadoria é decisão editorial, não filtro de exibição."
about.method.retention:
  en: "Daily granularity is retained for a rolling twelve months; a monthly rollup is kept permanently. The rollup is written before any pruning, and pruning is aborted if the rollup fails, because repository traffic is the one series that cannot be reconstructed."
  pt: "A granularidade diária é retida por doze meses móveis; um rollup mensal é mantido permanentemente. O rollup é gravado antes de qualquer poda, e a poda é abortada se o rollup falhar, porque o tráfego de repositório é a única série que não pode ser reconstituída."
about.method.privacy:
  en: "Only aggregates per package and per repository are published. No contributor profile, issue author or e-mail address is collected."
  pt: "Apenas agregados por pacote e por repositório são publicados. Nenhum perfil de contribuidor, autor de issue ou endereço de e-mail é coletado."

