# =============================================================================
# i18n.yml -- every literal string the dashboard prints (SPEC.md S7.3)
# =============================================================================
#
# Contract
# --------
# * One top-level key per string, each with exactly the two languages `en`
#   and `pt`. A key present in one language and missing in the other is a
#   build failure: tests/testthat/test-i18n-parity.R enforces parity.
# * No `.qmd` file may contain a literal user-visible string. Everything that
#   is not a value read from `site/_data/*.json` comes from this file, via
#   `tr()` / `tr_f()` in `site/_i18n.R`.
# * `{placeholder}` markers are filled by `tr_f(key, placeholder = value)`.
#   A string passed through `tr()` is emitted verbatim, braces included --
#   that is how the technical endpoint strings below keep their `{pkg}`.
# * Values are rendered as Markdown, so backticks, `**bold**` and `[a](b)`
#   work. HTML is only used where a value is interpolated into a tag.
#
# Normative content
# -----------------
# `about.limit.N.*` reproduces SPEC.md S10 in full. That text is normative:
# it must be published complete, in both languages. Do not summarise it.
# `downloads.label` is the mandatory download label of SPEC.md S7.2; it must
# never be replaced by anything resembling "total downloads".
# =============================================================================

